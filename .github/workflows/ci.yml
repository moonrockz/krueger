name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Pinned MoonBit toolchain (moon/moonc/core). Bump deliberately; see AGENTS.md.
  MOONBIT_VERSION: "0.10.14+7d59c7ec9"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hustcer/setup-moonbit@v1
        with:
          version: ${{ env.MOONBIT_VERSION }}
          core-version: ${{ env.MOONBIT_VERSION }}

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: moon update

      - name: Check formatting
        run: |
          moon fmt
          moon fmt scripts/*.mbtx
          git diff --exit-code -- '*.mbt' '*.mbtx' || (echo "::error::moon fmt produced changes — run 'moon fmt' locally and commit" && exit 1)

      - name: Check code
        run: moon check

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hustcer/setup-moonbit@v1
        with:
          version: ${{ env.MOONBIT_VERSION }}
          core-version: ${{ env.MOONBIT_VERSION }}

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: moon update

      - name: Run unit tests
        run: mise run test:unit

      - name: Run script tests
        run: mise run test:scripts

  targets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hustcer/setup-moonbit@v1
        with:
          version: ${{ env.MOONBIT_VERSION }}
          core-version: ${{ env.MOONBIT_VERSION }}

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: moon update

      - name: Test the library on every supported target
        run: mise run test:targets

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hustcer/setup-moonbit@v1
        with:
          version: ${{ env.MOONBIT_VERSION }}
          core-version: ${{ env.MOONBIT_VERSION }}

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: moon update

      - name: Calculate coverage (warn on push, gate on PR)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            mise run coverage:ci-gate
          else
            mise run coverage:ci-warn
          fi

  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hustcer/setup-moonbit@v1
        with:
          version: ${{ env.MOONBIT_VERSION }}
          core-version: ${{ env.MOONBIT_VERSION }}

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: moon update

      - name: Cache Elm parity corpus
        uses: actions/cache@v4
        with:
          path: .corpus
          key: elm-parity-corpus-${{ hashFiles('tests/corpus/manifest.json') }}

      - name: Fetch and verify the corpus
        run: mise run corpus:fetch

      - name: Score Elm parity
        run: mise run test:parity

      - name: Add parity summary to the job summary
        if: always()
        run: |
          if [ -f _build/reports/parity/summary.md ]; then
            cat _build/reports/parity/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload parity reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-report
          path: _build/reports/parity/
          if-no-files-found: warn
          retention-days: 30
