name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# One release run per tag at a time. GitHub has started two runs for one tag
# push (krueger-kbg); the second waits, finds the version published and the
# GitHub release created, and succeeds without doing either again.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Pinned MoonBit toolchain (moon/moonc/core). Bump deliberately; see AGENTS.md.
  MOONBIT_VERSION: "0.10.14+7d59c7ec9"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hustcer/setup-moonbit@v1
        with:
          version: ${{ env.MOONBIT_VERSION }}
          core-version: ${{ env.MOONBIT_VERSION }}

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: moon update

      - name: Check formatting
        run: |
          moon fmt
          moon fmt scripts/*.mbtx
          git diff --exit-code -- '*.mbt' '*.mbtx' || (echo "::error::moon fmt produced changes — run 'moon fmt' locally and commit" && exit 1)

      - name: Check code
        run: moon check

      - name: Run tests
        run: mise run test:unit

      - name: Run script tests
        run: mise run test:scripts

  publish:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hustcer/setup-moonbit@v1
        with:
          version: ${{ env.MOONBIT_VERSION }}
          core-version: ${{ env.MOONBIT_VERSION }}

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: moon update

      - name: Set up credentials
        env:
          MOONCAKES_USER_TOKEN: ${{ secrets.MOONCAKES_USER_TOKEN }}
        run: mise run release:credentials

      - name: Publish to mooncakes.io
        run: mise run release:publish

  release:
    needs: [validate, publish]
    # A manual run from a branch has no tag to name a GitHub release after.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "GitHub release $TAG already exists; nothing to do"
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes
          fi
