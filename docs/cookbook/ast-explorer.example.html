<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elm AST explorer</title>
<style>
:root { color-scheme: light dark; --bg: #ffffff; --fg: #1f2328;
  --muted: #656d76; --line: #d0d7de; --mark: #fff1a8; --sel: #dbeafe;
  --value: #0b6e4f; --error: #b42318; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #16181d; --fg: #e6edf3; --muted: #8d96a0; --line: #30363d;
    --mark: #5a4b00; --sel: #1d3557; --value: #7ee2b8; --error: #ff8a80; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg);
  font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
main { display: grid; grid-template-columns: 1fr 1fr; height: 100vh; }
#src, #side { margin: 0; padding: 12px 16px; overflow: auto; }
#src { border-right: 1px solid var(--line); white-space: pre; }
#src mark { background: var(--mark); color: inherit; }
#diags { margin: 0 0 8px; padding: 0; list-style: none; color: var(--error); }
#diags li { cursor: pointer; }
details details { margin-left: 16px; }
summary { cursor: pointer; white-space: nowrap; border-radius: 3px; }
summary.leaf { list-style: none; padding-left: 13px; }
summary.leaf::-webkit-details-marker { display: none; }
summary.selected { background: var(--sel); }
.field, .range { color: var(--muted); }
.type { font-weight: 600; }
.value { color: var(--value); }
@media (max-width: 720px) {
  main { grid-template-columns: 1fr; height: auto; }
  #src { border-right: 0; border-bottom: 1px solid var(--line); } }
</style>
</head>
<body>
<main><pre id="src"></pre><div id="side"><ul id="diags"></ul><div id="tree"></div></div></main>
<script id="ax-data" type="application/json">{"source":"module Greeting exposing (greet)\n\n{-| Say hello. -}\n\n\ngreet : String -> String\ngreet name =\n    case name of\n        \"\" ->\n            \"Hello! 👋\"\n\n        _ ->\n            \"Hello, \" ++ name ++ \"!\"\n","tree":{"type":"file.file","range":[1,1,13,37],"start":0,"end":197,"children":[{"type":"module.normal","field":"moduleDefinition","range":[1,1,1,33],"start":0,"end":32,"children":[{"type":"module_name.module_name","field":"moduleName","range":[1,8,1,16],"start":7,"end":15,"value":"Greeting","children":[]},{"type":"exposing.explicit","field":"exposingList","range":[1,17,1,33],"start":16,"end":32,"children":[{"type":"expose.function","field":"explicit","range":[1,27,1,32],"start":26,"end":31,"value":"greet","children":[]}]}]},{"type":"comment.comment","field":"comments","range":[3,1,3,18],"start":34,"end":51,"value":"{-| Say hello. -}","children":[]},{"type":"declaration.function","field":"declarations","range":[6,1,13,37],"start":54,"end":197,"children":[{"type":"signature.signature","field":"signature","range":[6,1,6,25],"start":54,"end":78,"children":[{"type":"name.name","field":"name","range":[6,1,6,6],"start":54,"end":59,"value":"greet","children":[]},{"type":"type.function","field":"typeAnnotation","range":[6,9,6,25],"start":62,"end":78,"children":[{"type":"type.typed","field":"left","range":[6,9,6,15],"start":62,"end":68,"value":"String","children":[]},{"type":"type.typed","field":"right","range":[6,19,6,25],"start":72,"end":78,"value":"String","children":[]}]}]},{"type":"implementation.implementation","field":"declaration","range":[7,1,13,37],"start":79,"end":197,"children":[{"type":"name.name","field":"name","range":[7,1,7,6],"start":79,"end":84,"value":"greet","children":[]},{"type":"pattern.var","field":"arguments","range":[7,7,7,11],"start":85,"end":89,"value":"name","children":[]},{"type":"expression.case","field":"expression","range":[8,5,13,37],"start":96,"end":197,"children":[{"type":"expression.functionOrValue","field":"expression","range":[8,10,8,14],"start":101,"end":105,"value":"name","children":[]},{"type":"case_branch.case_branch","field":"cases","range":[9,9,10,23],"start":117,"end":146,"children":[{"type":"pattern.string","field":"pattern","range":[9,9,9,11],"start":117,"end":119,"value":"\"\"","children":[]},{"type":"expression.literal","field":"expression","range":[10,13,10,23],"start":135,"end":146,"value":"\"Hello! 👋\"","children":[]}]},{"type":"case_branch.case_branch","field":"cases","range":[12,9,13,37],"start":156,"end":197,"children":[{"type":"pattern.all","field":"pattern","range":[12,9,12,10],"start":156,"end":157,"value":"_","children":[]},{"type":"expression.operatorapplication","field":"expression","range":[13,13,13,37],"start":173,"end":197,"children":[{"type":"expression.literal","field":"left","range":[13,13,13,22],"start":173,"end":182,"value":"\"Hello, \"","children":[]},{"type":"expression.operatorapplication","field":"right","range":[13,26,13,37],"start":186,"end":197,"children":[{"type":"expression.functionOrValue","field":"left","range":[13,26,13,30],"start":186,"end":190,"value":"name","children":[]},{"type":"expression.literal","field":"right","range":[13,34,13,37],"start":194,"end":197,"value":"\"!\"","children":[]}]}]}]}]}]}]}]},"diagnostics":[]}</script>
<script>
(function () {
  "use strict";
  var data = JSON.parse(document.getElementById("ax-data").textContent);
  var text = data.source, root = data.tree, selected = null;
  var src = document.getElementById("src");
  var treeEl = document.getElementById("tree");

  // Draw the source and mark the text from start to end.
  function mark(item, scroll) {
    src.textContent = "";
    if (!item) { src.textContent = text; return; }
    var m = document.createElement("mark");
    m.textContent = text.slice(item.start, item.end);
    src.append(text.slice(0, item.start), m, text.slice(item.end));
    if (scroll) m.scrollIntoView({ block: "nearest" });
  }

  function span(cls, s) {
    var e = document.createElement("span");
    e.className = cls; e.textContent = s; return e;
  }

  // Build the tree pane with a loop and a stack: trees can be 400 deep.
  function build() {
    var stack = [[root, null, treeEl, 0]];
    while (stack.length) {
      var top = stack.pop(), n = top[0], r = n.range;
      n.parent = top[1];
      var d = document.createElement("details");
      var s = document.createElement("summary");
      if (n.field) s.append(span("field", n.field + ": "));
      s.append(span("type", n.type), " ",
        span("range", "[" + r[0] + ":" + r[1] + "-" + r[2] + ":" + r[3] + "]"));
      if (n.children.length === 0) {
        s.className = "leaf";
        var v = JSON.stringify(n.value);
        s.append(" ", span("value", v.length > 60 ? v.slice(0, 57) + "..." : v));
      }
      s.axNode = n; n.el = d; n.summary = s;
      d.open = top[3] < 3;
      d.append(s); top[2].append(d);
      for (var i = n.children.length - 1; i >= 0; i--) {
        stack.push([n.children[i], n, d, top[3] + 1]);
      }
    }
  }

  function select(n) {
    if (selected) selected.summary.classList.remove("selected");
    selected = n;
    n.summary.classList.add("selected");
    for (var p = n.parent; p; p = p.parent) p.el.open = true;
    n.summary.scrollIntoView({ block: "nearest" });
    mark(n, true);
  }

  // The innermost node that contains the offsets a..b.
  function innermost(a, b) {
    var n = root, found = true;
    while (found) {
      found = false;
      for (var i = 0; i < n.children.length; i++) {
        var c = n.children[i];
        if (c.start <= a && b <= c.end) { n = c; found = true; break; }
      }
    }
    return n;
  }

  // The UTF-16 offset of a DOM position in the source pane.
  function offsetOf(node, offset) {
    var r = document.createRange();
    r.selectNodeContents(src);
    r.setEnd(node, offset);
    return r.toString().length;
  }

  src.addEventListener("mouseup", function () {
    var sel = window.getSelection();
    if (!root || !sel.rangeCount) return;
    var r = sel.getRangeAt(0);
    if (!src.contains(r.startContainer)) return;
    var a = offsetOf(r.startContainer, r.startOffset);
    var b = offsetOf(r.endContainer, r.endOffset);
    // A caret selects the character after it.
    if (a === b && b < text.length) b = a + 1;
    select(innermost(a, b));
  });
  treeEl.addEventListener("mouseover", function (e) {
    var s = e.target.closest("summary");
    if (s && s.axNode) mark(s.axNode, false);
  });
  treeEl.addEventListener("mouseleave", function () { mark(selected, false); });
  treeEl.addEventListener("click", function (e) {
    var s = e.target.closest("summary");
    if (s && s.axNode) select(s.axNode);
  });

  var diags = document.getElementById("diags");
  data.diagnostics.forEach(function (d) {
    var li = document.createElement("li");
    li.textContent = d.code + " " + d.title + ": " + d.message;
    li.addEventListener("click", function () { mark(d, true); });
    diags.append(li);
  });
  if (root) build(); else treeEl.textContent = "No AST.";
  mark(null, false);
})();
</script>
</body>
</html>
